name: Build and Test json thresher

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Toolchain and Global Packages
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-14 g++-14 libstdc++-14-dev

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Extract the standalone ~1.4 MB binary directly into the runner's PATH
    - name: Fetch Pre-compiled cnpm
      run: |
        docker create --name cnpm-container ghcr.io/datadriven-cam/cnpm:latest
        docker cp cnpm-container:/usr/local/bin/cnpm ./cnpm
        docker rm cnpm-container
        chmod +x ./cnpm
        sudo mv ./cnpm /usr/local/bin/cnpm

    - name: Install Project Dependencies
      run: |
        # Resolves all dependencies specified in the root package.json
        cnpm install

    - name: Set Compiler Environment Variables
      run: |
        echo "CC=gcc-14" >> $GITHUB_ENV
        echo "CXX=g++-14" >> $GITHUB_ENV

    - name: Build Core Library (Root Makefile)
      run: |
        make

    - name: Build doctest Binary (Test Directory Makefile)
      run: |
        cd test
        make

    - name: Run Test Suite via cnpm
      run: |
        # Executes the package.json test script directly via cnpm
        cnpm test
