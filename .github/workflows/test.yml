name: Build and Test json thresher

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Nightly GCC Snapshot
      run: |
        wget --quiet https://kayari.org/gcc-latest/gcc-latest.deb
        sudo dpkg -i gcc-latest.deb
        
        # Force the environment to use the absolute latest experimental build paths
        echo "/opt/gcc-latest/bin" >> $GITHUB_PATH
        echo "CC=/opt/gcc-latest/bin/gcc" >> $GITHUB_ENV
        echo "CXX=/opt/gcc-latest/bin/g++" >> $GITHUB_ENV
        echo "LD_RUN_PATH=/opt/gcc-latest/lib64" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=/opt/gcc-latest/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV

    - name: Verify Compiler
      run: $CXX --version # This will print out your expected experimental 16/17 branch state

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Extract the standalone ~1.4 MB binary directly into the runner's PATH
    - name: Fetch Pre-compiled cnpm
      run: |
        docker create --name cnpm-container ghcr.io/datadriven-cam/cnpm:latest true
        docker cp cnpm-container:/usr/local/bin/cnpm ./cnpm
        docker rm cnpm-container
        chmod +x ./cnpm
        sudo mv ./cnpm /usr/local/bin/cnpm

    - name: Install Project Dependencies
      run: |
        # Resolves all dependencies specified in the root package.json
        cnpm install
        ls -lastr ./cpp_modules/*
        cnpm fmt

    - name: Ensure mime-db is Present (cnpm fallback)
      run: |
        if [ ! -d "cpp_modules/mime-db" ]; then
          echo "⚠️ cnpm skipped mime-db. Fetching manually for C++ test runner..."
          mkdir -p cpp_modules/mime-db
          # Fetch the raw JSON straight from the source/npm repository archive
          curl -s https://githubusercontent.com/jshttp/mime-db/v1.42.0/db.json -o cpp_modules/mime-db/db.json
        fi

    - name: Set Compiler Environment Variables
      run: |
        echo "CC=gcc" >> $GITHUB_ENV
        echo "CXX=g++" >> $GITHUB_ENV

    - name: Build Core Library (Root Makefile)
      run: |
        make

    - name: Build Local test-gbnf-validator
      run: |
        cd cpp_modules/llama
        # Clean old broken build artifacts if necessary
        rm -rf build
        
        # Fix: Use LLAMA_BUILD_TESTS instead of GGML_BUILD_TESTS
        cmake -B build -DGGML_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=ON
        cmake --build build --target test-gbnf-validator
        
        # Add the generated binary directory directly to the runner profile path
        echo "${{ github.workspace }}/cpp_modules/llama/build/bin" >> $GITHUB_PATH 

    - name: Build doctest Binary (Test Directory Makefile)
      run: |
        cd test

        pwd
        mkdir -p build/src
        make
        cd ..

    - name: Run Test Suite via cnpm
      run: |
        # Executes the package.json test script directly via cnpm
        cnpm test
