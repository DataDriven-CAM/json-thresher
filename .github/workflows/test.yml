name: Build and Test json thresher

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Toolchain and Global Packages
      run: |
        sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-16 g++-16 libstdc++-16-dev

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Extract the standalone ~1.4 MB binary directly into the runner's PATH
    - name: Fetch Pre-compiled cnpm
      run: |
        docker create --name cnpm-container ghcr.io/datadriven-cam/cnpm:latest true
        docker cp cnpm-container:/usr/local/bin/cnpm ./cnpm
        docker rm cnpm-container
        chmod +x ./cnpm
        sudo mv ./cnpm /usr/local/bin/cnpm

    - name: Install Project Dependencies
      run: |
        # Resolves all dependencies specified in the root package.json
        cnpm install
        ls -lastr ./cpp_modules/*
        cnpm fmt

    - name: Set Compiler Environment Variables
      run: |
        echo "CC=gcc-16" >> $GITHUB_ENV
        echo "CXX=g++-16" >> $GITHUB_ENV

    - name: Build Core Library (Root Makefile)
      run: |
        make

    - name: Build Local test-gbnf-validator
      run: |
        cd cpp_modules/llama
        # Clean old broken build artifacts if necessary
        rm -rf build
        
        # Fix: Use LLAMA_BUILD_TESTS instead of GGML_BUILD_TESTS
        cmake -B build -DGGML_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=ON
        cmake --build build --target test-gbnf-validator
        
        # Add the generated binary directory directly to the runner profile path
        echo "${{ github.workspace }}/cpp_modules/llama/build/bin" >> $GITHUB_PATH 
               
    - name: Build doctest Binary (Test Directory Makefile)
      run: |
        cd test

        pwd
        mkdir -p build/src
        make
        cd ..

    - name: Run Test Suite via cnpm
      run: |
        # Executes the package.json test script directly via cnpm
        cnpm test
